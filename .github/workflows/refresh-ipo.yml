# Auto-refresh the curated IPO calendar. The Azure runner gets past e-ipo's
# Cloudflare (Railway's datacenter IP does not), so we scrape here and commit
# data/ipo-calendar.json back; Railway/Netlify redeploy on the push.
#
# NOTE: If e-ipo.co.id blocks GitHub's datacenter IP (Cloudflare challenge),
# refresh-ipo.js will log a warning and exit 0 — preserving the last good data.
name: refresh-ipo
on:
  schedule:
    - cron: '0 1 * * *'     # daily 01:00 UTC (08:00 WIB)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Supabase free pauses a project after 7 days idle; this 2-day cron ping
      # keeps it awake so the model download keeps working. (Restore it once in
      # the dashboard first if it's already paused.)
      - name: keep supabase awake
        run: curl -s -m 15 -o /dev/null "https://ivrldaznlmiuqqfenvmm.supabase.co/rest/v1/" || true
      - run: pip install curl_cffi
      # Diagnose whether Cloudflare is blocking this runner's IP
      - name: check e-ipo reachability
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 15 -A "Mozilla/5.0 Chrome/126" "https://e-ipo.co.id/id/home" || echo "FAIL")
          echo "e-ipo HTTP status from runner: $STATUS"
      - run: npm run refresh:ipo
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ipo-calendar.json
          git diff --staged --quiet || git commit -m "chore: refresh ipo calendar [skip ci]"
          git push
